          <script type="text/javascript">

          function formatDAGdata(data) {
              // This function can alter the returned data before building the table, formatting it in a way
              // that is easier to display and manipulate in a table

              $.each(data, function(index, item) {
                // Format DAG siez to GiB
                item.DAGsize = formatBytes(item.DAGsize);
                if (item.Url) item.Url = '<a href="' + item.Url + '" target="_blank">' + item.Url + '</a>';
                if (item.Updated) item.Updated = formatTimeSince(item.Updated);
              });
              return data;
            };

            $(".table").bootstrapTable({
              async: "false",
              autoRefreshInterval: parseInt(Math.max(configrunning.Interval, 30)), // refresh once per interval, at least 30 seconds
              onColumnSwitch: function() {
                $("body").css("cursor", "default");
              },
              onColumnSwitchAll: function() {
                $("body").css("cursor", "default");
              },
              onCreatedControls: function() {
                $("body").css("cursor", "wait");
              },
              onLoadSuccess: function() {
                document.getElementsByName("add-updatedtimestamp")[0].innerHTML = document.getElementsByName("add-updatedtimestamp")[0].innerHTML.replace(/\.$| \(information updated.+/, "") + " (information updated " + refreshtimestamp + ").";
                $("body").css("cursor", "default");
              },
              onRefresh: function() {
                $("body").css("cursor", "wait");
              },
              onReorderColumn: function() {
                $("body").css("cursor", "default");
              },
              onToggle: function() {
                $("body").css("cursor", "default");
              }
            });

            $(window).resize(function () {
              if (window.RT) clearTimeout(window.RT);
              window.RT = setTimeout(function() {
                this.location.reload(false); /* false to get page from cache */
              }, 200);
            });

            $(document).ready(function () {
              // Fix, button text is wrong
              document.getElementsByName("toggle")[0].innerHTML = "<i class=\"fa fa-toggle-off\"></i> Show card view";
            });

          </script>
